<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Зачёт семестра</title>
<style>
:root{--ink:#0f1211;--ink2:#151917;--brass:#b09a63;--brass-hi:#d2c396;--paper:#e2e0d8;--muted:#8e968b;--line:rgba(226,224,216,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(180deg,#121614,#0f1211 55%);color:var(--paper);
  font-family:'PT Sans','Segoe UI',system-ui,Arial,sans-serif}
.box{max-width:440px;text-align:center;display:grid;gap:14px;justify-items:center}
svg{width:78px;height:auto}
h1{font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-weight:500;font-size:26px;
  text-transform:uppercase;letter-spacing:.06em;margin:0}
p{margin:0;color:var(--muted);font-size:15.5px}
a{display:inline-block;margin-top:8px;padding:11px 22px;border-radius:8px;background:var(--brass);
  color:#14140f;text-decoration:none;font-family:'Oswald','Arial Narrow',Arial,sans-serif;
  font-size:14px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="box">
  <svg viewBox="0 0 120 332" aria-hidden="true">
    <defs>
      <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8b9668"/><stop offset=".45" stop-color="#657049"/><stop offset="1" stop-color="#4b5539"/>
      </linearGradient>
    </defs>
    <path d="M20 304 L20 86 L50 40 Q60 26 70 40 L100 86 L100 304 Q100 316 88 316 L32 316 Q20 316 20 304 Z" fill="url(#f)" stroke="#8a2a2f" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="60" cy="62" r="14" fill="#cda94e" stroke="#7d5f16" stroke-width="1.2"/>
    <text x="60" y="230" text-anchor="middle" font-family="Oswald,Arial" font-size="86" fill="rgba(226,224,216,.45)">?</text>
  </svg>
  <h1>Погон без знаков различия</h1>
  <p>Такой страницы на сайте нет. Возможно, ссылка устарела или в адресе опечатка.</p>
  <a href="/">На главную</a>
</div>
</body>
</html>
