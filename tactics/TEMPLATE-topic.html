<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Впишите краткое описание темы для поисковиков.">
<meta name="theme-color" content="#0f1211">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зачёт семестра">
<title>Название темы</title>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<header class="top">
  <a class="brand" href="../index.html">
    <svg class="brand__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6l3.09 6.9 7.41.78-5.55 5.02 1.57 7.3L12 17.9l-6.52 3.7 1.57-7.3L1.5 9.28l7.41-.78z"/></svg>
    <span class="brand__txt"><b>ЗАЧЁТ&nbsp;СЕМЕСТРА</b><i>общая тактика · устав</i></span>
  </a>
  <nav class="top__nav">
    <a class="chip" data-nav="home" href="../index.html">Главная</a>
    <button class="chip chip--sq" id="btnMenu" type="button" title="Меню" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="chip chip--sq" id="btnSound" type="button" title="Звук вкл/выкл">звук</button>
  </nav>
  <div class="navmenu" id="siteMenu" hidden></div>
</header>
<main id="screen" class="screen" tabindex="-1"></main>
<footer class="foot">
  <span>Впишите сюда источник темы (методичка, конспект, номер занятия).</span>
</footer>
<nav class="tabbar" style="--tabs:3" aria-label="Разделы">
  <a data-nav="home" href="../index.html"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>Главная</a>
  <a data-nav="ustav" href="../ustav/index.html"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V9l4-6 4 6v12z"/><path d="M8 13h8M8 17h8"/></svg>Устав</a>
  <a data-nav="tactics" href="index.html"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>Тактика</a>
</nav>

<script src="../shared/nav-data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/deck-engine.js"></script>
<script>
"use strict";
/* ============================================================
   ШАБЛОН ТЕМЫ. Как этим пользоваться:
   1. Скопируйте этот файл, переименуйте (например boevoy-poryadok.html).
   2. Поправьте <title> вверху файла и подписи в шапке/футере, если нужно.
   3. Замените key и содержимое cards ниже — по одной карточке на термин.
      id — латиницей, у каждой карточки свой, использовать один раз.
      term — короткое название термина (то, что нужно узнать/назвать).
      def  — определение целиком, тем текстом, который нужно запомнить.
      tip  — необязательно: подсказка, как отличить от похожего термина.
   4. Загрузите файл в бакет рядом с остальными страницами tactics/.
   5. Добавьте на него ссылку в tactics/index.html (скопируйте там
      одну из строк "h += mode(...)" и поменяйте название/файл/описание).
   Движок сам построит все режимы: термин→определение, определение→термин,
   верно/неверно, экзамен по теме, карточки и список всех терминов —
   переписывать ничего не нужно, кроме DECK ниже.
   ============================================================ */
var DECK = {
  subject:'tactics', key:'boevoy-poryadok',           // key — уникальный на весь сайт, латиницей
  title:'Название темы',
  eyebrow:'Общая тактика · раздел/занятие',
  intro:'Короткое пояснение, что за тема и о чём вопросы.',
  cards:[
    { id:'t1', term:'Термин 1', def:'Полное определение термина 1.', tip:'Необязательная подсказка.' },
    { id:'t2', term:'Термин 2', def:'Полное определение термина 2.', tip:'' },
    { id:'t3', term:'Термин 3', def:'Полное определение термина 3.', tip:'' }
    /* добавляйте карточки дальше в том же формате — от 6 штук и больше,
       иначе в некоторых режимах будет не из чего выбирать варианты ответа */
  ]
};
DeckEngine.init(DECK, { backHref:'index.html', backLabel:'К предмету «Общая тактика»' });
Site.initNav('tactics');
Site.wireSoundToggle(document.getElementById('btnSound'));
Site.initMenu("../");
</script>
</body>
</html>
