function file(href, path, t, d, size){
  return '<a class="file" href="'+href+'" download>' +
    '<span class="file__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg></span>' +
    '<span class="file__b"><span class="file__t">'+t+'</span><span class="file__d">'+d+'</span></span>' +
    '<span class="file__size">'+size+'</span></a>';
}
/* Открывает PDF в новой вкладке (не заставляет скачивать); под названием — точный
   путь, куда положить файл, чтобы карточка заработала. */
function pdfFile(href, path, t, d, expectPath){
  return '<a class="file" href="'+href+'" target="_blank" rel="noopener">' +
    '<span class="file__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg></span>' +
    '<span class="file__b"><span class="file__t">'+t+'</span><span class="file__d">'+d+' · <code>'+expectPath+'</code></span></span>' +
    '<span class="file__size">PDF</span></a>';
}
