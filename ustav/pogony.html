<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Игра-тренажёр для запоминания воинских званий Вооружённых Сил РФ: погоны, знаки различия и правила обращения.">
<meta name="theme-color" content="#0c110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<title>Погоны РФ</title>
<style>
/* ============================================================
   ПОГОНЫ РФ — тренажёр воинских званий
   Тёмная приглушённая тема: латунь и сукно, без свечения.
   Единственное яркое пятно на странице — сам погон.
   ============================================================ */
:root{
  --ink:#0f1211;
  --ink2:#151917;
  --ink3:#1b201d;
  --brass:#b09a63;
  --brass-hi:#d2c396;
  --brass-dim:#796d49;
  --red:#8f3a3e;
  --paper:#e2e0d8;
  --muted:#8e968b;
  --ok:#5c9268;
  --err:#a9565c;
  --line:rgba(226,224,216,.10);
  --line-2:rgba(226,224,216,.17);
  --r:10px;
  --maxw:1060px;
  --disp:'Oswald','Arial Narrow',Arial,sans-serif;
  --body:'PT Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --mono:'PT Mono','Consolas',ui-monospace,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--body);
  font-size:16px;
  line-height:1.55;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
.bg{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:linear-gradient(180deg,#121614 0%,var(--ink) 55%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--disp);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.01em;line-height:1.15}
p{margin:0}
svg{display:block}
u{text-underline-offset:3px;text-decoration-color:var(--brass-dim)}

/* ---------- шапка ---------- */
.top{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:max(9px,env(safe-area-inset-top)) max(14px,4vw) 9px;
  background:rgba(15,18,17,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;padding:3px 4px;border-radius:8px}
.brand__star{width:18px;height:18px;fill:var(--brass);flex:none}
.brand__txt{display:flex;flex-direction:column;line-height:1.05;text-align:left}
.brand__txt b{font-family:var(--disp);font-size:17px;font-weight:500;letter-spacing:.09em}
.brand__txt i{font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.top__nav{display:flex;align-items:center;gap:5px}
.chip{
  font-family:var(--disp); font-size:12.5px; letter-spacing:.09em; text-transform:uppercase;
  padding:7px 12px; border-radius:7px; color:var(--muted);
  border:1px solid transparent; transition:color .15s, background .15s, border-color .15s;
}
.chip:hover{color:var(--paper);background:rgba(226,224,216,.05)}
.chip.is-on{color:var(--brass-hi);border-color:var(--line-2);background:rgba(176,154,99,.09)}
.chip--sq{padding:7px 10px}
.chip.is-off{opacity:.45;text-decoration:line-through}

/* ---------- каркас ---------- */
.screen{flex:1 0 auto;width:100%;max-width:var(--maxw);margin:0 auto;padding:24px max(16px,4vw) 60px}
.foot{
  border-top:1px solid var(--line); color:var(--muted); font-size:12.5px;
  padding:16px max(16px,4vw) 24px; display:grid;gap:6px;
  max-width:var(--maxw);margin:0 auto;width:100%;
}
.foot a{color:var(--muted)}

/* ---------- заголовок страницы ---------- */
.pagehead{display:grid;gap:9px;padding-bottom:16px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.pagehead__back{
  justify-self:start;font-family:var(--disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:4px 0;
}
.pagehead__back:hover{color:var(--brass-hi)}
.pagehead__eyebrow{font-family:var(--disp);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass-dim)}
.pagehead h1{font-size:clamp(25px,4.2vw,34px);text-transform:uppercase;letter-spacing:.02em}
.pagehead__lead{color:var(--muted);font-size:15.5px;max-width:62ch}

/* ---------- главная ---------- */
.home{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:30px;align-items:center;margin-bottom:8px}
.home__stage{
  position:relative;display:grid;place-items:center;padding:20px 12px 40px;
  border:1px solid var(--line);border-radius:12px;background:var(--ink2);
}
.home__cap{
  position:absolute;left:0;right:0;bottom:10px;text-align:center;
  font-family:var(--disp);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-hi);
}
.home h1{font-size:clamp(28px,5vw,42px);text-transform:uppercase;letter-spacing:.02em}
.home__lead{color:var(--muted);font-size:16px;max-width:54ch;margin-top:12px}
.setrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.setrow__lbl{font-family:var(--disp);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;padding:3px;gap:3px;border:1px solid var(--line-2);border-radius:8px;background:rgba(0,0,0,.2)}
.seg button{
  font-family:var(--disp);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 13px;border-radius:6px;color:var(--muted);transition:.15s;
}
.seg button:hover{color:var(--paper)}
.seg button.is-on{background:var(--brass);color:#14140f}

/* разделы на главной */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:10px;margin-top:6px}
.tile{
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;text-align:left;
  padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--ink2);
  transition:border-color .15s,background .15s;
}
.tile:hover{border-color:var(--line-2);background:var(--ink3)}
.tile__ico{width:34px;height:34px;display:grid;place-items:center;color:var(--brass-dim)}
.tile__ico svg{width:22px;height:22px}
.tile__t{display:block;font-family:var(--disp);font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.tile__d{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}

/* ---------- заголовок секции ---------- */
.sect-h{display:flex;align-items:baseline;gap:12px;margin:36px 0 12px}
.sect-h h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass-dim)}
.sect-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sect-h small{color:var(--muted);font-size:12.5px}

/* ---------- список режимов ---------- */
.modes{display:grid;gap:8px}
.mode{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;
  width:100%;text-align:left;padding:14px 16px;
  border:1px solid var(--line);border-radius:10px;background:var(--ink2);
  transition:border-color .15s,background .15s;
}
.mode:hover{border-color:var(--line-2);background:var(--ink3)}
.mode__ico{width:36px;height:36px;display:grid;place-items:center;color:var(--brass-dim)}
.mode__ico svg{width:23px;height:23px}
.mode__t{display:block;font-family:var(--disp);font-size:17px;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
.mode__d{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.mode__meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.mode__meta b{display:block;color:var(--brass-hi);font-size:14px;font-weight:400}

/* ---------- полоса статистики ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:22px}
.strip__i{background:var(--ink2);padding:13px 15px}
.strip__k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--disp)}
.strip__v{font-family:var(--mono);font-size:21px;color:var(--paper);margin-top:3px;font-variant-numeric:tabular-nums}
.strip__v small{font-size:12.5px;color:var(--muted)}

/* ---------- игра ---------- */
.quiz{display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar__track{flex:1 1 160px;height:4px;border-radius:99px;background:rgba(226,224,216,.09);overflow:hidden}
.bar__fill{height:100%;background:var(--brass);transition:width .3s ease}
.bar__n{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar__n b{color:var(--paper);font-weight:400}
.bar__streak{font-family:var(--mono);font-size:12.5px;color:var(--brass-hi)}
.bar__score{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

.play{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start}
.play--wide{grid-template-columns:minmax(0,1fr)}
.stage{
  position:relative;display:grid;place-items:center;gap:10px;padding:20px 16px;
  border:1px solid var(--line);border-radius:12px;background:var(--ink2);
}
.stage__hint{font-family:var(--disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.stage__toggle{position:absolute;top:8px;right:8px;font-size:11px;letter-spacing:.1em;border:1px solid var(--line)}

.qtext{font-family:var(--disp);font-size:clamp(20px,2.8vw,26px);line-height:1.2;text-transform:uppercase;letter-spacing:.02em}
.qsub{color:var(--muted);font-size:14px;margin-top:7px}
.qname{
  font-family:var(--disp);font-size:clamp(25px,4.4vw,36px);color:var(--brass-hi);
  text-transform:uppercase;letter-spacing:.03em;line-height:1.1;margin-top:8px;
}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.answers--one{grid-template-columns:1fr}
.answers--duo{grid-template-columns:1fr 1fr}
.answers--straps{grid-template-columns:repeat(4,1fr);gap:10px}
.ans{
  display:flex;align-items:center;gap:11px;padding:14px 15px;text-align:left;min-height:54px;
  border:1px solid var(--line);border-radius:9px;background:var(--ink2);
  font-size:16px;transition:border-color .14s,background .14s;
}
.ans:hover:not(:disabled){border-color:var(--brass-dim);background:var(--ink3)}
.ans:disabled{cursor:default}
.ans__k{
  flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);background:rgba(226,224,216,.07);
}
.ans.is-ok{border-color:var(--ok);background:rgba(92,146,104,.12)}
.ans.is-ok .ans__k{background:var(--ok);color:#0a140c}
.ans.is-bad{border-color:var(--err);background:rgba(169,86,92,.12);animation:shake .3s}
.ans.is-bad .ans__k{background:var(--err);color:#170609}
.ans.is-dim{opacity:.4}
.ans--strap{flex-direction:column;gap:8px;align-items:center;padding:12px 8px}
.ans--pair{flex-direction:column;gap:9px;align-items:center;padding:16px 8px}

/* разбор ответа */
.fb{display:grid;gap:11px;padding:15px 16px;border-radius:10px;border:1px solid var(--line);background:var(--ink2);animation:rise .25s ease both}
.fb.is-ok{border-left:3px solid var(--ok)}
.fb.is-bad{border-left:3px solid var(--err)}
.fb__h{font-family:var(--disp);font-size:13.5px;letter-spacing:.14em;text-transform:uppercase}
.fb.is-ok .fb__h{color:var(--ok)}
.fb.is-bad .fb__h{color:var(--err)}
.fb__body{display:flex;gap:15px;align-items:center;flex-wrap:wrap}
.fb__txt{flex:1 1 230px;font-size:15px}
.fb__txt em{font-style:normal;color:var(--brass-hi)}
.fb__tip{color:var(--muted);font-size:13.5px;margin-top:6px}
.fb__row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.btn{
  font-family:var(--disp);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  padding:11px 20px;border-radius:8px;background:var(--brass);color:#14140f;
  transition:filter .15s;
}
.btn:hover{filter:brightness(1.08)}
.btn--ghost{background:transparent;color:var(--paper);border:1px solid var(--line-2)}
.btn--ghost:hover{border-color:var(--brass-dim);color:var(--brass-hi);filter:none}
.btn--sm{padding:8px 14px;font-size:12.5px}

/* ---------- итоги ---------- */
.res{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:8px}
.res__mark{
  width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--disp);font-size:48px;color:#14140f;background:var(--brass);
}
.res__mark small{display:block;font-size:10px;letter-spacing:.16em;color:rgba(20,20,15,.62);margin-top:-6px}
.res h2{font-size:clamp(21px,3.4vw,28px);text-transform:uppercase}
.res__sub{color:var(--muted);font-family:var(--mono);font-size:13px}
.errlist{display:grid;gap:7px;width:100%;max-width:620px;text-align:left}
.errlist__i{display:flex;align-items:center;gap:13px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--ink2);width:100%;text-align:left}
.errlist__i:hover{border-color:var(--line-2)}
.errlist__t{flex:1;min-width:0}
.errlist__t b{display:block;font-family:var(--disp);letter-spacing:.03em;text-transform:uppercase;font-size:15px;font-weight:500}
.errlist__t span{color:var(--muted);font-size:12.5px}
.errlist__x{color:var(--err);font-family:var(--mono);font-size:11.5px;text-align:right;max-width:38%}

/* ---------- изучение ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters .chip{border:1px solid var(--line)}
.filters--order{align-items:center;margin-top:-8px}
.filters__lbl{font-family:var(--disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-right:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{
  display:grid;justify-items:center;gap:8px;padding:14px 10px 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--ink2);
  transition:border-color .15s,background .15s;text-align:center;
}
.card:hover{border-color:var(--line-2);background:var(--ink3)}
.card__n{font-family:var(--mono);font-size:10.5px;color:var(--brass-dim)}
.card__t{font-family:var(--disp);font-size:14px;letter-spacing:.03em;text-transform:uppercase;line-height:1.15}
.card__s{font-size:11.5px;color:var(--muted)}
.card.is-weak{border-color:rgba(169,86,92,.45)}
.card.is-known{border-color:rgba(92,146,104,.4)}

/* ---------- карточка звания (страница) ---------- */
.detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:start}
.detail__v{display:grid;gap:16px;justify-items:center;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--ink2)}
.dl{display:grid;gap:12px}
.dl__i{display:grid;gap:2px;padding-left:12px;border-left:2px solid var(--line-2)}
.dl__k{font-family:var(--disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dl__v{font-size:15.5px}
.dl__v.big{font-family:var(--disp);font-size:19px;color:var(--brass-hi);text-transform:uppercase;letter-spacing:.02em;font-weight:500}
.pager{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

/* ---------- шпаргалка ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.cheat{border-collapse:collapse;width:100%;min-width:620px;font-size:14.5px}
table.cheat th,table.cheat td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
table.cheat th{font-family:var(--disp);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:rgba(0,0,0,.25)}
table.cheat td.num{font-family:var(--mono);color:var(--brass-dim);font-size:11.5px;width:30px}
table.cheat td.nm{font-weight:700}
table.cheat td.ad{color:var(--brass-hi)}
table.cheat td.ins{color:var(--muted);font-size:13px}
.cheat__group td{background:rgba(176,154,99,.09);font-family:var(--disp);letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--brass-hi)}

/* ---------- справка ---------- */
.prose{max-width:66ch;display:grid;gap:13px;font-size:16px}
.prose h3{font-size:14px;letter-spacing:.15em;text-transform:uppercase;color:var(--brass-dim);margin-top:14px}
.prose ul{margin:0;padding-left:19px;display:grid;gap:7px}
.prose li::marker{color:var(--brass-dim)}
.quote{border-left:2px solid var(--brass-dim);padding:8px 0 8px 15px;color:var(--muted);font-style:italic}
.kbd{font-family:var(--mono);font-size:11.5px;padding:2px 6px;border:1px solid var(--line-2);border-radius:4px;color:var(--brass-hi)}

/* ---------- прогресс ---------- */
.prog{display:grid;gap:8px}
.prog__i{display:grid;grid-template-columns:30px minmax(0,1fr) 72px;gap:12px;align-items:center;font-size:14px}
.prog__nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog__t{display:block;height:6px;border-radius:99px;background:rgba(226,224,216,.08);overflow:hidden;margin-top:4px}
.prog__f{display:block;height:100%;border-radius:99px;background:var(--brass-dim)}
.prog__f.ok{background:var(--ok)}
.prog__f.bad{background:var(--err)}
.prog__x{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- погон и фигура ---------- */
.strap{height:280px;width:auto}
.strap--xl{height:300px}
.strap--lg{height:250px}
.strap--md{height:180px}
.strap--sm{height:112px}
.strap--xs{height:62px}
.strap--tiny{height:42px}
.figure{height:280px;width:auto}
.figure--sm{height:200px}
.photo{height:280px;width:auto;border-radius:10px;border:1px solid var(--line)}

/* ---------- нижняя панель (телефон) ---------- */
.tabbar{display:none}

/* ---------- анимации ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-4px)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes floatup{to{opacity:0;transform:translateY(-40px)}}
.pop{animation:pop .28s ease both}
.floater{
  position:fixed;z-index:90;pointer-events:none;font-family:var(--mono);font-size:18px;color:var(--brass-hi);
  animation:floatup .9s ease-out forwards;
}
@media (hover:none){
  .mode:hover,.card:hover,.tile:hover{background:var(--ink2);border-color:var(--line)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ============================================================
   АДАПТАЦИЯ ПОД ПЛАНШЕТ И ТЕЛЕФОН
   ============================================================ */
@media (max-width:880px){
  .home{grid-template-columns:1fr;gap:20px}
  .home__stage{order:-1;padding:16px 12px 36px}
  .play{grid-template-columns:1fr;gap:18px}
  .detail{grid-template-columns:1fr;gap:20px}
  .strap--xl{height:240px}
}

@media (max-width:620px){
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
  .screen{padding:18px 14px 34px}
  .brand__txt i{display:none}
  .brand__txt b{font-size:16px}
  .top{padding-left:12px;padding-right:12px}
  .top__nav .chip[data-nav]{display:none}

  /* нижняя навигация вместо верхних вкладок */
  .tabbar{
    display:grid;grid-template-columns:repeat(4,1fr);

   Система координат погона: 120 × 332, низ погона — y = 316.

var UID = 0;

function starPath(cx, cy, r){
  var pts = [], i, rr, a;
  for(i = 0; i < 10; i++){
    rr = (i % 2) ? r * 0.40 : r;
    a = -Math.PI / 2 + i * Math.PI / 5;
    pts.push((cx + rr * Math.cos(a)).toFixed(2) + ' ' + (cy + rr * Math.sin(a)).toFixed(2));
  }
  return 'M' + pts.join('L') + 'Z';
}
function starFacets(cx, cy, r){
  var d = '', i, a;
  for(i = 0; i < 5; i++){
    a = -Math.PI / 2 + i * 2 * Math.PI / 5;
    d += 'M' + cx.toFixed(1) + ' ' + cy.toFixed(1) + 'L' + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);
  }
  return d;
}
function drawStar(cx, cy, r, uid){
  return '<path d="' + starPath(cx, cy, r) + '" fill="url(#sg' + uid + ')" stroke="#6d5518" stroke-width="' + (r > 22 ? 1.4 : 1) + '"/>' +
         '<path d="' + starFacets(cx, cy, r) + '" stroke="rgba(96,74,18,.5)" stroke-width="' + (r > 22 ? 1.3 : .9) + '" fill="none" stroke-linecap="round"/>';
}

/* Государственный герб — схематичный двуглавый орёл */
function drawGerb(cx, cy, s, uid){

  g += '<path d="M0 -2 C7 -2 10 4 10 12 C10 20 6 26 0 31 C-6 26 -10 20 -10 12 C-10 4 -7 -2 0 -2 Z"/>';

/* Где стоят звёзды на погоне */
function starLayout(ins){
  var n = ins.stars ? ins.stars.n : 0;
  var size = ins.stars ? ins.stars.s : 's';
  var r = ({ s: 13, m: 18, l: 21, xl: 35 })[size];
  var pts = [];
  if(ins.gaps === 1){
    if(n === 1) pts = [[60, 230]];
    if(n === 2) pts = [[37, 264], [83, 264]];
    if(n === 3) pts = [[37, 264], [83, 264], [60, 218]];
    if(n === 4) pts = [[37, 264], [83, 264], [60, 218], [60, 172]];
  } else if(ins.gaps === 2){
    if(n === 1) pts = [[60, 228]];
    if(n === 2) pts = [[41, 258], [79, 258]];
    if(n === 3) pts = [[41, 258], [79, 258], [60, 208]];
  } else if(size === 's'){
    if(n === 1) pts = [[60, 240]];
    if(n === 2) pts = [[60, 262], [60, 215]];
    if(n === 3) pts = [[60, 268], [60, 221], [60, 174]];
  } else if(size === 'xl'){
    pts = ins.gerb ? [[60, 258]] : [[60, 238]];
  } else {
    if(n === 1) pts = [[60, 236]];
    if(n === 2) pts = [[60, 272], [60, 204]];
    if(n === 3) pts = [[60, 276], [60, 208], [60, 140]];
  }
  return { r: r, pts: pts };
}

/* Внутренность погона без обёртки <svg> — используется и отдельно, и на фигуре */
function strapInner(rank, branch, uid){

  }

  /* --- нашивки (лычки) --- */
  if(ins.str){

var STORE = 'pogony-rf-v1';
var state = { branch:'both', sound:true, stats:{}, best:{} };

function loadState(){
  try{
    var raw = localStorage.getItem(STORE);
    if(raw){
      var o = JSON.parse(raw);
      if(o.branch) state.branch = o.branch;
      if(typeof o.sound === 'boolean') state.sound = o.sound;
      state.stats = o.stats || {};
      state.best = o.best || {};
    }
  }catch(e){}
}
function saveState(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
function statOf(id){
  if(!state.stats[id]) state.stats[id] = { ok:0, no:0 };
  return state.stats[id];
}

/* ---------- помощники ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ var i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; } return a; }
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }
function rankName(r, b){ return (b === 'navy' && r.v) ? r.v.n : r.a.n; }
function rankAddr(r, b){ return (b === 'navy' && r.v) ? r.v.ad : r.a.ad; }
function byId(id){ for(var i=0;i<RANKS.length;i++) if(RANKS[i].id===id) return RANKS[i]; return null; }
function plural(n, one, few, many){
  var m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function fmtTime(ms){
  var s = Math.round(ms / 1000), m = Math.floor(s / 60);
  return m + ':' + ('0' + (s % 60)).slice(-2);
}

/* Материал с учётом выбранной ветки: армия / флот / всё */
function items(){
  var out = [], i;
  for(i = 0; i < RANKS.length; i++){
    if(state.branch !== 'navy') out.push({ r:RANKS[i], b:'army' });
    if(state.branch !== 'army' && RANKS[i].v) out.push({ r:RANKS[i], b:'navy' });
  }
  return out;
}
function allItems(){
  var out = [], i;
  for(i = 0; i < RANKS.length; i++){
    out.push({ r:RANKS[i], b:'army' });
    if(RANKS[i].v) out.push({ r:RANKS[i], b:'navy' });
  }
  return out;
}

   4. ЗВУК
   ============================================================ */
var actx = null;
function beep(kind){
  if(!state.sound) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = actx || new AC();
    var seq = kind === 'ok' ? [[620,0,.08],[930,.07,.12]]
            : kind === 'bad' ? [[180,0,.18]]
            : [[520,0,.06],[700,.06,.08],[1040,.12,.16]];
    for(var i = 0; i < seq.length; i++){
      (function(f, at, dur){
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = kind === 'bad' ? 'sawtooth' : 'triangle';
        o.frequency.value = f;
        g.gain.value = 0.0001;
        o.connect(g); g.connect(actx.destination);
        var t = actx.currentTime + at;
        g.gain.exponentialRampToValueAtTime(kind === 'bad' ? .07 : .12, t + .012);
        g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        o.start(t); o.stop(t + dur + .02);
      })(seq[i][0], seq[i][1], seq[i][2]);
    }
  }catch(e){}
}

  { id:'match',      t:'Армия ↔ Флот',    d:'Соответствие войсковых и корабельных званий',               ico:'anchor', n:12 },
  { id:'exam',       t:'Экзамен',         d:'20 вопросов всех типов вперемешку, на время и с оценкой',   ico:'exam',   n:20 }
];
function modeById(id){ for(var i=0;i<MODES.length;i++) if(MODES[i].id===id) return MODES[i]; return MODES[0]; }
function modeAvailable(id){
  if(id === 'match') return allItems().some(function(x){ return x.r.v; });
  return true;
}

/* ---------- неверные варианты ----------
   Часть берём из соседних ступеней (чтобы вопрос был не на угадайку),
   часть — с любого места шкалы, чтобы набор вариантов шёл вразброс. */
function wrongOnes(item, count, keyFn, pool){
  var key = keyFn(item), i, k;
  var cands = [];
  for(i = 0; i < pool.length; i++) if(keyFn(pool[i]) !== key) cands.push(pool[i]);
  shuffle(cands);

  var near = cands.slice().sort(function(a, b){
    var da = Math.abs(a.r.t - item.r.t) + Math.random() * 3.6;
    var db = Math.abs(b.r.t - item.r.t) + Math.random() * 3.6;
    return da - db;
  });

  var far = count > 1 ? (Math.random() < 0.45 ? 2 : 1) : 0;
  if(far >= count) far = count - 1;

  var out = [], seen = {};
  seen[key] = 1;
  for(i = 0; i < near.length && out.length < count - far; i++){
    k = keyFn(near[i]);
    if(seen[k]) continue;
    seen[k] = 1;
    out.push(near[i]);
  }
  for(i = 0; i < cands.length && out.length < count; i++){
    k = keyFn(cands[i]);
    if(seen[k]) continue;
    seen[k] = 1;
    out.push(cands[i]);
  }
  return shuffle(out);
}

/* ---------- материал сессии: слабые звания выпадают чаще ---------- */
function drawItems(n){
  var pool = items(), bag = [], i, j, st, w;
  if(!pool.length) pool = allItems();
  for(i = 0; i < pool.length; i++){
    st = state.stats[pool[i].r.id] || { ok:0, no:0 };
    w = 1 + Math.min(3, st.no) + (st.ok === 0 ? 1 : 0);
    for(j = 0; j < w; j++) bag.push(pool[i]);
  }
  shuffle(bag);
  var out = [], used = {};
  for(i = 0; i < bag.length && out.length < n; i++){
    var k = bag[i].r.id + bag[i].b;
    if(used[k]) continue;
    used[k] = 1;
    out.push(bag[i]);
  }
  while(out.length < n && pool.length) out.push(pickOne(pool));
  return shuffle(out);
}

/* ---------- сборка вопроса ---------- */
function buildQuestion(kind, item){
  var pool = items();
  if(pool.length < 4) pool = allItems();
  /* fig — показывать фигуру военнослужащего вместо отдельного погона;
     решается для каждого вопроса заново, чтобы картинка шла вразброс */
  var q = {
    kind:kind, item:item, opts:[], correct:0,
    fig: kind === 'strap2addr' ? (Math.random() < 0.7)
       : kind === 'strap2name' ? (Math.random() < 0.35)
       : false
  };

  if(kind === 'higher'){
    var others = wrongOnes(item, 8, function(x){ return x.r.t; }, pool);
    var near = others.filter(function(x){ return Math.abs(x.r.t - item.r.t) <= 5; });
    var mate = near.length ? pickOne(near) : (others[0] || pickOne(pool));
    var pair = shuffle([item, mate]);
    q.opts = pair;
    q.correct = pair[0].r.t > pair[1].r.t ? 0 : 1;
    q.item = pair[q.correct];
    return q;
  }

  if(kind === 'match'){
    var src = item;
    if(!src.r.v) src = pickOne(allItems().filter(function(x){ return x.r.v; }));
    var fromNavy = Math.random() < 0.5;
    q.from = fromNavy ? 'navy' : 'army';
    q.to = fromNavy ? 'army' : 'navy';
    q.item = { r:src.r, b:q.from };
    var mpool = allItems().filter(function(x){ return x.b === q.to && x.r.v; });
    var target = { r:src.r, b:q.to };
    var wr = wrongOnes(target, 3, function(x){ return rankName(x.r, q.to); }, mpool);
    var all = shuffle([target].concat(wr));
    q.opts = all;
    for(var m = 0; m < all.length; m++) if(all[m].r.id === src.r.id) q.correct = m;
    return q;
  }

  var keyFn = kind === 'strap2addr'
    ? function(x){ return rankAddr(x.r, x.b); }
    : function(x){ return rankName(x.r, x.b); };
  var wrong = wrongOnes(item, 3, keyFn, pool);
  var opts = shuffle([item].concat(wrong));
  q.opts = opts;
  for(var z = 0; z < opts.length; z++) if(opts[z] === item) q.correct = z;
  return q;
}

var ses = null;

function startSession(modeId, customItems){
  var mode = modeById(modeId);
  var n = mode.n;
  var list = (customItems && customItems.length) ? shuffle(customItems.slice()).slice(0, 20) : drawItems(n);

  if(modeId === 'match'){
    var withNavy = list.filter(function(x){ return x.r.v; });
    if(withNavy.length < 6) withNavy = shuffle(allItems().filter(function(x){ return x.b === 'army' && x.r.v; })).slice(0, n);
    list = withNavy;
  }

  var kinds = ['strap2name', 'strap2addr', 'name2strap', 'higher'];
  if(allItems().some(function(x){ return x.r.v; })) kinds.push('match');

  var qs = [], i, kind;
  for(i = 0; i < list.length; i++){
    kind = modeId === 'exam' ? pickOne(kinds) : modeId;
    if(kind === 'match' && !list[i].r.v) kind = 'strap2name';
    qs.push(buildQuestion(kind, list[i]));
  }
  shuffle(qs);

  ses = { mode:modeId, qs:qs, i:0, score:0, streak:0, maxStreak:0, right:0, wrong:[], t0:Date.now(), answered:false };
  go('quiz');
}

function answerQ(idx, el){
  if(!ses || ses.answered) return;
  var q = ses.qs[ses.i];
  ses.answered = true;
  var ok = idx === q.correct;
  var st = statOf(q.item.r.id);
  if(ok){
    st.ok++;
    ses.right++;
    ses.streak++;
    if(ses.streak > ses.maxStreak) ses.maxStreak = ses.streak;
    var pts = 10 + Math.min(10, (ses.streak - 1) * 2);
    ses.score += pts;
    beep('ok');
    floater('+' + pts, el);
  } else {
    st.no++;
    ses.streak = 0;
    ses.wrong.push({ q:q, chosen:idx });
    beep('bad');
  }
  saveState();
  paintAnswer(idx, q, ok);
}

function nextQ(){
  if(!ses) return;
  ses.i++;
  ses.answered = false;
  if(ses.i >= ses.qs.length){ go('result'); return; }
  go('quiz');
}

function floater(txt, el){
  if(!el || !el.getBoundingClientRect) return;
  var box = document.createElement('div');
  box.className = 'floater';
  box.textContent = txt;
  var r = el.getBoundingClientRect();
  box.style.left = (r.left + r.width / 2 - 16) + 'px';
  box.style.top = (r.top - 4) + 'px';
  document.body.appendChild(box);
  setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); }, 950);
}

/* Перемешивание списка званий, устойчивое к перерисовке:
   порядок меняется только по кнопке «Вразброс», а не при каждом рендере. */
function seedHash(s){
  var h = 2166136261, i;
  for(i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function studySorted(list){
  if(studyOrder === 'tier') return list;
  return list.map(function(x){ return { x:x, k:seedHash(x.r.id + x.b + studySeed) }; })
             .sort(function(a, b){ return a.k - b.k; })
             .map(function(o){ return o.x; });
}

function go(name, arg){

  else if(name === 'cheat') renderCheat();
  else if(name === 'stats') renderStats();
  else if(name === 'help') renderHelp();
  var nav = NAV_OF[name] || name;
  var i, b, list = document.querySelectorAll('.top__nav .chip[data-nav], .tabbar button[data-nav]');
  for(i = 0; i < list.length; i++){

  var prev = state.best[ses.mode];
  if(!prev || pct > prev.pct){ state.best[ses.mode] = { pct:pct, date:Date.now() }; saveState(); }
  beep(pct >= 60 ? 'win' : 'bad');

  var h = '<div class="res">';
  h += '<div class="res__mark pop">' + mark + '<small>ОЦЕНКА</small></div>';
  h += '<h2>' + (pct === 100 ? 'Без единой ошибки' : pct >= 90 ? 'Отличный результат' : pct >= 75 ? 'Хорошо, но есть пробелы' : pct >= 60 ? 'Удовлетворительно' : 'Нужно ещё потренироваться') + '</h2>';
  h += '<p class="res__sub">' + ses.right + ' из ' + total + ' · ' + pct + '% · ' + ses.score + ' очков · ' + time + ' · серия ' + ses.maxStreak + '</p>';

  if(ses.wrong.length){
    h += '<div class="sect-h" style="width:100%;max-width:620px;margin-top:14px"><h2>Разбор ошибок</h2><small>' + ses.wrong.length + ' ' + plural(ses.wrong.length, 'ошибка', 'ошибки', 'ошибок') + '</small></div>';
    h += '<div class="errlist">';
    for(var i = 0; i < ses.wrong.length; i++){
      var w = ses.wrong[i], q = w.q, r = q.item.r;
      var b = (q.kind === 'match') ? q.from : q.item.b;
      var chosen = q.opts[w.chosen];
      var chosenTxt = q.kind === 'strap2addr' ? rankAddr(chosen.r, chosen.b)
                    : q.kind === 'match' ? rankName(chosen.r, q.to)
                    : rankName(chosen.r, chosen.b);
      h += '<button class="errlist__i" data-card="' + r.id + '" data-cardb="' + b + '" type="button">' + strapSVG(r, b, 'strap--xs');
      h += '<span class="errlist__t"><b>' + esc(rankName(r, b)) + '</b><span>' + esc(r.d) + '</span></span>';
      h += '<span class="errlist__x">вы: ' + esc(chosenTxt) + '</span></button>';
    }
    h += '</div>';
  }

  h += '<div class="fb__row" style="justify-content:center;margin-top:6px">';
  h += '<button class="btn" data-mode="' + ses.mode + '" type="button">Ещё раз</button>';
  if(ses.wrong.length) h += '<button class="btn btn--ghost" data-retry="1" type="button">Работа над ошибками</button>';
  h += '<button class="btn btn--ghost" data-nav="train" type="button">К режимам</button>';
  h += '</div></div>';
  screenEl.innerHTML = h;
}

/* ---------- ИЗУЧЕНИЕ ---------- */
function renderStudy(){
  var list = items();
  if(!list.length) list = allItems();
  list = studySorted(list);
  var h = pagehead({
    back:'menu', backLabel:'На главную', eyebrow:'Раздел', title:'Изучение',
    lead:'Нажмите на погон — откроется карточка со знаками различия, обращением и подсказкой. Зелёная рамка — звание усвоено, красная — вы в нём ошибались.'
  });
  h += '<div class="filters">';
  h += '<button class="chip' + (studyFilter === 'all' ? ' is-on' : '') + '" data-filter="all" type="button">Все</button>';
  for(var g = 0; g < GROUPS.length; g++){
    h += '<button class="chip' + (studyFilter === GROUPS[g] ? ' is-on' : '') + '" data-filter="' + esc(GROUPS[g]) + '" type="button">' + GROUPS[g] + '</button>';
  }
  h += '</div>';
  h += '<div class="filters filters--order">';
  h += '<span class="filters__lbl">Порядок</span>';
  h += '<button class="chip' + (studyOrder === 'shuffle' ? ' is-on' : '') + '" data-order="shuffle" type="button">Вразброс</button>';
  h += '<button class="chip' + (studyOrder === 'tier' ? ' is-on' : '') + '" data-order="tier" type="button">По старшинству</button>';
  h += '</div>';
  h += '<div class="grid">';
  for(var i = 0; i < list.length; i++){
    var it = list[i];
    if(studyFilter !== 'all' && it.r.grp !== studyFilter) continue;
    var st = state.stats[it.r.id] || { ok:0, no:0 };
    var cls = (st.ok >= 3 && st.ok > st.no) ? ' is-known' : (st.no > st.ok && st.no > 0 ? ' is-weak' : '');
    h += '<button class="card' + cls + '" data-card="' + it.r.id + '" data-cardb="' + it.b + '" type="button">';
    h += '<span class="card__n">' + it.r.t + '</span>';
    h += strapSVG(it.r, it.b, 'strap--sm');
    h += '<span class="card__t">' + esc(rankName(it.r, it.b)) + '</span>';
    h += '<span class="card__s">' + (it.b === 'navy' ? 'корабельное' : 'войсковое') + '</span>';
    h += '</button>';
  }
  h += '</div>';
  screenEl.innerHTML = h;
}

/* ---------- КАРТОЧКА ЗВАНИЯ (отдельная страница) ---------- */
function renderCard(){
  if(!cardRef) { go('study'); return; }
  var r = byId(cardRef.id), b = cardRef.b;
  if(!r) { go('study'); return; }
  if(b === 'navy' && !r.v) b = 'army';
  var st = state.stats[r.id] || { ok:0, no:0 };

  var h = pagehead({
    back:'study', backLabel:'К списку званий',
    eyebrow:r.sostav + ' · ступень ' + r.t + ' из 20',
    title:rankName(r, b)
  });
  h += '<div class="detail">';
  h += '<div class="detail__v">' + strapSVG(r, b, 'strap--lg') + figureSVG(r, b, 'figure--sm') + '</div>';
  h += '<div><div class="dl">';
  h += '<div class="dl__i"><div class="dl__k">Обращение</div><div class="dl__v big">' + esc(rankAddr(r, b)) + '</div></div>';
  h += '<div class="dl__i"><div class="dl__k">Знаки различия на погоне</div><div class="dl__v">' + esc(r.d) + '</div></div>';
  h += '<div class="dl__i"><div class="dl__k">Как запомнить</div><div class="dl__v">' + esc(r.tip) + '</div></div>';
  h += '<div class="dl__i"><div class="dl__k">Соответствие</div><div class="dl__v">' +
       (r.v ? 'войсковое «' + esc(r.a.n) + '» = корабельное «' + esc(r.v.n) + '»' : 'корабельного соответствия нет') + '</div></div>';
  if(st.ok + st.no > 0){
    h += '<div class="dl__i"><div class="dl__k">Ваша статистика</div><div class="dl__v">верно ' + st.ok + ' · ошибок ' + st.no + '</div></div>';
  }
  h += '</div>';

  h += '<div class="pager">';
  var prev = prevRank(r.t), next = nextRank(r.t);
  if(prev) h += '<button class="btn btn--ghost btn--sm" data-card="' + prev.id + '" data-cardb="' + b + '" type="button">← ' + esc(rankName(prev, b)) + '</button>';
  if(next) h += '<button class="btn btn--ghost btn--sm" data-card="' + next.id + '" data-cardb="' + b + '" type="button">' + esc(rankName(next, b)) + ' →</button>';
  h += '</div>';
  h += '</div></div>';
  screenEl.innerHTML = h;
}
function prevRank(t){ for(var i=RANKS.length-1;i>=0;i--) if(RANKS[i].t < t) return RANKS[i]; return null; }
function nextRank(t){ for(var i=0;i<RANKS.length;i++) if(RANKS[i].t > t) return RANKS[i]; return null; }

/* ---------- ПРОГРЕСС ---------- */
function renderStats(){
  var rows = [], i, st, tot, pct;
  for(i = 0; i < RANKS.length; i++){
    st = state.stats[RANKS[i].id] || { ok:0, no:0 };
    tot = st.ok + st.no;
    pct = tot ? Math.round(st.ok * 100 / tot) : -1;
    rows.push({ r:RANKS[i], st:st, tot:tot, pct:pct });
  }
  var weak = rows.filter(function(x){ return x.tot > 0 && x.pct < 70; }).sort(function(a, b){ return a.pct - b.pct; });

  var h = pagehead({
    back:'menu', backLabel:'На главную', eyebrow:'Раздел', title:'Прогресс',
    lead:'Статистика хранится только в этом браузере и не отправляется никуда.'
  });
  if(weak.length){
    h += '<div class="fb is-bad" style="margin-bottom:20px"><div class="fb__h">Слабые места</div><div class="fb__body"><div class="fb__txt">' +
         esc(weak.slice(0, 6).map(function(x){ return x.r.a.n; }).join(', ')) +
         '.</div><button class="btn btn--sm" data-weak="1" type="button">Тренировать их</button></div></div>';
  }
  h += '<div class="prog">';
  for(i = 0; i < rows.length; i++){
    var w = rows[i];
    var fill = w.pct < 0 ? 0 : w.pct;
    var fcls = w.pct < 0 ? '' : (w.pct >= 70 ? ' ok' : ' bad');
    h += '<button class="prog__i" data-card="' + w.r.id + '" data-cardb="army" type="button" style="text-align:left;width:100%">';
    h += '<span>' + strapSVG(w.r, 'army', 'strap--tiny') + '</span>';
    h += '<span><span class="prog__nm">' + esc(w.r.a.n) + '</span><span class="prog__t"><span class="prog__f' + fcls + '" style="width:' + fill + '%"></span></span></span>';
    h += '<span class="prog__x">' + (w.tot ? w.pct + '% · ' + w.tot : '—') + '</span>';
    h += '</button>';
  }
  h += '</div>';
  h += '<div class="fb__row" style="margin-top:22px"><button class="btn btn--ghost btn--sm" data-reset="1" type="button">Сбросить прогресс</button></div>';
  screenEl.innerHTML = h;
}

/* ============================================================
   8. СОБЫТИЯ
   ============================================================ */
document.addEventListener('click', function(e){
  if(!e.target || !e.target.closest) return;
  var t = e.target.closest('[data-a],[data-nav],[data-mode],[data-branch],[data-filter],[data-order],[data-card],[data-next],[data-retry],[data-weak],[data-reset],[data-fig]');
  if(!t) return;

  if(t.hasAttribute('data-a')){ answerQ(parseInt(t.getAttribute('data-a'), 10), t); return; }
  if(t.hasAttribute('data-next')){ nextQ(); return; }
  if(t.hasAttribute('data-fig')){ if(ses && !ses.answered){ ses.qs[ses.i].fig = !ses.qs[ses.i].fig; renderQuiz(); } return; }
  if(t.hasAttribute('data-order')){
    studyOrder = t.getAttribute('data-order');
    if(studyOrder === 'shuffle') studySeed = Math.floor(Math.random() * 1e9);
    renderStudy();
    return;
  }
  if(t.hasAttribute('data-card')){ go('card', { id:t.getAttribute('data-card'), b:t.getAttribute('data-cardb') || 'army' }); return; }
  if(t.hasAttribute('data-mode')){ startSession(t.getAttribute('data-mode')); return; }
  if(t.hasAttribute('data-nav')){ go(t.getAttribute('data-nav')); return; }
  if(t.hasAttribute('data-branch')){ state.branch = t.getAttribute('data-branch'); saveState(); renderMenu(); return; }
  if(t.hasAttribute('data-filter')){ studyFilter = t.getAttribute('data-filter'); renderStudy(); return; }
  if(t.hasAttribute('data-retry')){
    startSession(ses.mode === 'exam' ? 'strap2name' : ses.mode, ses.wrong.map(function(w){ return w.q.item; }));
    return;
  }
  if(t.hasAttribute('data-weak')){
    var pool = items(), weakItems = [];
    for(var i = 0; i < pool.length; i++){
      var s = state.stats[pool[i].r.id];
      if(s && s.no > 0 && s.ok / (s.ok + s.no) < 0.7) weakItems.push(pool[i]);
    }
    if(!weakItems.length) weakItems = drawItems(12);
    startSession('strap2name', weakItems);
    return;
  }
  if(t.hasAttribute('data-reset')){
    if(confirm('Сбросить всю статистику и лучшие результаты?')){
      state.stats = {}; state.best = {}; saveState(); renderStats();
    }
    return;
  }
});

document.getElementById('btnSound').addEventListener('click', function(){
  state.sound = !state.sound;
  saveState();
  this.classList.toggle('is-off', !state.sound);
  this.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
  if(state.sound) beep('ok');
});

document.addEventListener('keydown', function(e){
  if(current !== 'quiz' || !ses) return;
  if(!ses.answered && e.key >= '1' && e.key <= '9'){
    var n = parseInt(e.key, 10) - 1;
    var b = screenEl.querySelectorAll('.ans');
    if(b[n]) answerQ(n, b[n]);
  } else if(ses.answered && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    nextQ();
  }
});

/* ============================================================
   9. СТАРТ
   ============================================================ */
loadState();
document.getElementById('btnSound').classList.toggle('is-off', !state.sound);
go('menu');
